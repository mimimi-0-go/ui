<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
  <title>パネル</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
</head>
<body data-conn="off">
  <header class="top">
    <div>
      <div class="eyebrow" id="devId">—</div>
      <h1 id="title">本体に接続してください</h1>
    </div>
    <span class="badge" id="badge"><i></i><span id="badgeText">未接続</span></span>
  </header>

  <main>
    <section class="intro" id="intro">
      <p>画面の内容は本体から読み込みます。下のボタンで接続してください。</p>
    </section>

    <section class="hero" id="hero" aria-live="polite">
      <div class="hero-label" id="heroLabel"></div>
      <div class="hero-value"><span id="heroValue">--</span><small id="heroUnit"></small></div>
      <div class="hero-sub" id="heroSub"></div>
    </section>

    <section id="controls" class="controls"></section>

    <section class="card" id="statusCard">
      <h2>ステータス</h2>
      <dl id="status" class="status"></dl>
    </section>

    <section id="actions" class="actions"></section>

    <p class="foot" id="foot"></p>
  </main>

  <div class="connect-bar" id="connectBar">
    <p id="connectMsg">本体とBluetoothで接続します</p>
    <button class="primary" id="connectBtn" type="button">本体に接続</button>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
